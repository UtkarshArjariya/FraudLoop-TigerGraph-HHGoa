<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="2330" viewBox="0 0 2200 2330" role="img" aria-labelledby="title desc">
<title id="title">FRAUDLOOP system architecture</title>
<desc id="desc">An analyst console and bounded prepared-data stream feed a FastAPI backend and Python investigation state machine. Python assessment and policy own decisions. GraphRAG combines graph, narrative and per-model ranks using weighted reciprocal rank fusion. All runtime graph reads and writes use an official TigerGraph MCP ClientSession. Guarded Gemini narration follows policy decisions, and strict answer validation gates graph write-back. Human evidence pause and resume, local answers and timelines are persisted.</desc>
