<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="2330" aria-labelledby="title desc" role="img" viewBox="0 0 2200 2330"><title id="title">FRAUDLOOP system architecture</title><desc id="desc">An analyst console and bounded prepared-data stream feed a FastAPI backend and Python investigation state machine. Python assessment and policy own decisions. GraphRAG combines graph, narrative and per-model ranks using weighted reciprocal rank fusion. All runtime graph reads and writes use an official TigerGraph MCP ClientSession. Guarded Gemini narration follows policy decisions, and strict answer validation gates graph write-back. Human evidence pause and resume, local answers and timelines are persisted.</desc><rect width="2200" height="2330" fill="#F5F7F3"/><style>text{font-family:&apos;DejaVu Sans&apos;,sans-serif;fill:#132f2d}</style><text x="90" y="105" fill="#132F2D" font-size="72" font-weight="700">FRAUDLOOP</text><text x="91" y="165" fill="#536964" font-size="38" font-weight="400">From suspicious activity to an auditable recommendation</text><text x="1910" y="105" fill="#167565" font-size="23" font-weight="700">ARCHITECTURE</text><path stroke="#C7D4CD" stroke-width="2" d="M90 195 H2110"/><rect width="980" height="185" x="90" y="240" fill="#FFF" stroke="#C7D4CD" stroke-width="2.5" rx="20"/><text x="128" y="294" fill="#132F2D" font-size="43" font-weight="700">React analyst console</text><text x="128" y="345" fill="#536964" font-size="35" font-weight="400">Queue · graph · evidence · approvals</text><text x="128" y="394" fill="#536964" font-size="35" font-weight="400">Case timelines, replay and live monitoring</text><rect width="940" height="185" x="1170" y="240" fill="#FFF" stroke="#C7D4CD" stroke-width="2.5" rx="20"/><text x="1208" y="294" fill="#132F2D" font-size="43" font-weight="700">Prepared-data stream</text><text x="1208" y="345" fill="#536964" font-size="35" font-weight="400">Timestamped transaction replay</text><text x="1208" y="394" fill="#536964" font-size="35" font-weight="400">Bounded at five transactions / second</text><path fill="none" stroke="#8CA29B" stroke-width="4.5" d="M580 425 V467"/><path fill="#8CA29B" d="M569 462 L580 480 L591 462 Z"/><path fill="none" stroke="#8CA29B" stroke-width="4.5" d="M1640 425 V467"/><path fill="#8CA29B" d="M1629 462 L1640 480 L1651 462 Z"/><rect width="980" height="160" x="90" y="480" fill="#E8F3EE" stroke="#92B9AC" stroke-width="2.5" rx="20"/><text x="128" y="537" fill="#132F2D" font-size="43" font-weight="700">FastAPI backend</text><text x="128" y="592" fill="#536964" font-size="35" font-weight="400">REST endpoints + server-sent events (SSE)</text><rect width="940" height="160" x="1170" y="480" fill="#E8F3EE" stroke="#92B9AC" stroke-width="2.5" rx="20"/><text x="1208" y="537" fill="#132F2D" font-size="40" font-weight="700">Detector → investigation queue</text><text x="1208" y="592" fill="#536964" font-size="34" font-weight="400">One active investigation · ten pending jobs</text><path fill="none" stroke="#8CA29B" stroke-width="4.5" d="M580 640 V702"/><path fill="#8CA29B" d="M569 697 L580 715 L591 697 Z"/><path fill="none" stroke="#8CA29B" stroke-width="4.5" d="M1640 640 V702"/><path fill="#8CA29B" d="M1629 697 L1640 715 L1651 697 Z"/><rect width="2020" height="310" x="90" y="715" fill="#E0EEE7" stroke="#74A391" stroke-width="2.5" rx="20"/><rect width="8" height="254" x="118" y="743" fill="#167565" rx="4"/><text x="150" y="778" fill="#132F2D" font-size="47" font-weight="700">Python investigation state machine</text><text x="150" y="838" fill="#132F2D" font-size="38" font-weight="400">Trigger → gather → assess → initial next best action</text><text x="150" y="891" fill="#132F2D" font-size="38" font-weight="400">Request evidence → reassess → final action → SAR → answer</text><path stroke="#ACCCBD" stroke-width="2" d="M150 922 H2050"/><text x="150" y="977" fill="#536964" font-size="35" font-weight="400">Persisted human pause / resume · Conditional stopping · Chronological evidence</text><path fill="none" stroke="#8CA29B" stroke-width="4.5" d="M580 1025 V1107"/><path fill="#8CA29B" d="M569 1102 L580 1120 L591 1102 Z"/><path fill="none" stroke="#8CA29B" stroke-width="4.5" d="M1640 1035 V1107"/><path fill="#8CA29B" d="M1629 1102 L1640 1120 L1651 1102 Z"/><path fill="#8CA29B" d="M1629 1043 L1640 1025 L1651 1043 Z"/><text x="705" y="1084" fill="#167565" font-size="27" font-weight="700">Decision path</text><text x="1743" y="1084" fill="#167565" font-size="27" font-weight="700">Evidence path</text><rect width="980" height="215" x="90" y="1120" fill="#FFF" stroke="#C7D4CD" stroke-width="2.5" rx="20"/><rect width="8" height="159" x="118" y="1148" fill="#167565" rx="4"/><text x="148" y="1177" fill="#132F2D" font-size="43" font-weight="700">Assessment + policy</text><text x="148" y="1230" fill="#536964" font-size="35" font-weight="400">Python owns verdicts, probabilities,</text><text x="148" y="1279" fill="#536964" font-size="35" font-weight="400">recommended actions and approval routes.</text><text x="148" y="1312" fill="#167565" font-size="30" font-weight="400">Capped evidence families · Explicit stopping rules</text><path fill="none" stroke="#8CA29B" stroke-width="4.5" d="M580 1335 V1407"/><path fill="#8CA29B" d="M569 1402 L580 1420 L591 1402 Z"/><rect width="980" height="190" x="90" y="1420" fill="#FFF" stroke="#C7D4CD" stroke-width="2.5" rx="20"/><text x="128" y="1477" fill="#132F2D" font-size="43" font-weight="700">Guarded Gemini narration</text><text x="128" y="1531" fill="#536964" font-size="34" font-weight="400">Explains decisions and cites retrieved evidence</text><text x="128" y="1580" fill="#536964" font-size="34" font-weight="400">Model fallback chain → template fallback</text><path fill="none" stroke="#8CA29B" stroke-width="4.5" d="M580 1610 V1682"/><path fill="#8CA29B" d="M569 1677 L580 1695 L591 1677 Z"/><rect width="980" height="225" x="90" y="1695" fill="#E8F3EE" stroke="#92B9AC" stroke-width="2.5" rx="20"/><text x="128" y="1752" fill="#132F2D" font-size="43" font-weight="700">Strict answer validation</text><text x="128" y="1807" fill="#536964" font-size="34" font-weight="400">Schema · dataset IDs · time bounds</text><text x="128" y="1856" fill="#536964" font-size="34" font-weight="400">Exposure · policy · routes · decision integrity</text><text x="128" y="1890" fill="#167565" font-size="34" font-weight="700">Must pass before graph write-back</text><rect width="940" height="270" x="1170" y="1120" fill="#FFF" stroke="#C7D4CD" stroke-width="2.5" rx="20"/><rect width="8" height="214" x="1198" y="1148" fill="#167565" rx="4"/><text x="1228" y="1177" fill="#132F2D" font-size="43" font-weight="700">GraphRAG retrieval</text><text x="1228" y="1230" fill="#536964" font-size="34" font-weight="400">Graph paths + analyst narrative matches</text><text x="1228" y="1279" fill="#536964" font-size="34" font-weight="400">Separate model-owned vector ranks</text><text x="1228" y="1328" fill="#536964" font-size="34" font-weight="400">Weighted RRF · Temporal eligibility</text><text x="1228" y="1366" fill="#167565" font-size="30" font-weight="400">Provenance retained for every source</text><path fill="none" stroke="#8CA29B" stroke-width="4.5" d="M1640 1400 V1457"/><path fill="#8CA29B" d="M1629 1452 L1640 1470 L1651 1452 Z"/><path fill="#8CA29B" d="M1629 1408 L1640 1390 L1651 1408 Z"/><rect width="940" height="150" x="1170" y="1470" fill="#E8F3EE" stroke="#92B9AC" stroke-width="2.5" rx="20"/><text x="1208" y="1528" fill="#132F2D" font-size="43" font-weight="700">Official TigerGraph MCP</text><text x="1208" y="1584" fill="#536964" font-size="33" font-weight="400">ClientSession · All runtime graph reads / writes</text><path fill="none" stroke="#8CA29B" stroke-width="4.5" d="M1640 1630 V1682"/><path fill="#8CA29B" d="M1629 1677 L1640 1695 L1651 1677 Z"/><path fill="#8CA29B" d="M1629 1638 L1640 1620 L1651 1638 Z"/><rect width="940" height="225" x="1170" y="1695" fill="#FFF" stroke="#C7D4CD" stroke-width="2.5" rx="20"/><text x="1208" y="1752" fill="#132F2D" font-size="43" font-weight="700">TigerGraph / FraudGraph</text><text x="1208" y="1807" fill="#536964" font-size="34" font-weight="400">Entities + edges · GSQL queries · WCC</text><text x="1208" y="1856" fill="#536964" font-size="34" font-weight="400">Model-owned vectors · FraudCase memory</text><text x="1208" y="1890" fill="#167565" font-size="32" font-weight="400">New live case vectors use BGE / emb_bge</text><path fill="none" stroke="#8CA29B" stroke-width="4.5" d="M580 1920 V1997"/><path fill="#8CA29B" d="M569 1992 L580 2010 L591 1992 Z"/><rect width="2020" height="180" x="90" y="2010" fill="#FFF" stroke="#C7D4CD" stroke-width="2.5" rx="20"/><text x="128" y="2066" fill="#132F2D" font-size="43" font-weight="700">Durable local state and replay</text><text x="128" y="2120" fill="#536964" font-size="36" font-weight="400">Validated answers + traces + timelines · Persisted human continuations</text><text x="128" y="2170" fill="#167565" font-size="32" font-weight="400">Live outputs are isolated from the preserved benchmark submission.</text><text x="90" y="2270" fill="#536964" font-size="34" font-weight="500">Recommendations only • Human/simulated evidence labeled • Local fallback disclosed</text></svg>